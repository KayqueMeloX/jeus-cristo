  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #e0e2ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    }
    .card {

    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(243, 195, 78, 0.2);
      border-top-color: #f3c34e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p.desc {

  <div class="card">

    <p style="margin-top: 6px;">Digital Educational Guide & Membership Access. Immediate email delivery.</p>
  </footer>

  <script>
    (function () {
      var STRIPE_LINKS = {
        "27":  "https://buy.stripe.com/28EdR99ibdEj1RVfl8ao803",
        "47":  "https://buy.stripe.com/aFa5kD9ibgQveEH0qeao804",
        "77":  "https://buy.stripe.com/9B6cN565Z43JeEH6OCao805",
        "100": "https://buy.stripe.com/28EaEX51V7fVfILb4Sao806"
      };

      var search = window.location.search || "";
      var params = new URLSearchParams(search);
      var seed = params.get("seed") || params.get("id") || params.get("tier") || params.get("amt") || "27";
      seed = String(seed).trim();

      var baseStripe = STRIPE_LINKS[seed] || STRIPE_LINKS["27"];

      // Preserve all tracking parameters (UTMs, sck, src, etc.)
      var forwardParams = new URLSearchParams();
      params.forEach(function (val, key) {
        if (key !== "seed" && key !== "id" && key !== "tier" && key !== "amt") {
          forwardParams.append(key, val);
        }
      });

      var targetUrl = baseStripe;
      var queryString = forwardParams.toString();
      if (queryString) {
        targetUrl += (targetUrl.indexOf("?") === -1 ? "?" : "&") + queryString;
      }

      // Track InitiateCheckout on pixel
      if (typeof fbq === "function") {
        try {
          fbq("track", "InitiateCheckout", {
            value: Number(seed) || 27,
            currency: "USD"
          });
        } catch (e) {}
      }

      var proceedBtn = document.getElementById("proceedLink");
      if (proceedBtn) {
        proceedBtn.href = targetUrl;
        proceedBtn.style.display = "block";
      }

      // Fast, clean redirect (no-referrer meta prevents leaking the offer page)
      setTimeout(function () {
        try {
          if (window.top && window.top !== window) {
            window.top.location.replace(targetUrl);
            return;
          }
        } catch (e) {}
        try {
          window.location.replace(targetUrl);
        } catch (e) {
          window.location.href = targetUrl;
        }
      }, 900);
    })();
  </script>
